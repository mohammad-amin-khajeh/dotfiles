# A TOML linter such as https://github.com/tombi-toml/tombi can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [ 1, 3, 3 ]
sort_by        = "mtime"
sort_sensitive = false
sort_reverse   = true
sort_dir_first = true
linemode       = "size_and_mtime"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 900
max_height      = 900
cache_dir       = "~/.cache/yazi"
image_delay     = 0
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
edit = [
	{ run = "${EDITOR:-vi} %s", desc = "$EDITOR", for = "unix", block = true },
	{ run = 'code "%*"',    orphan = true, desc = "code",         for = "windows" },
	{ run = 'code -w "%*"', block = true,  desc = "code (block)", for = "windows" },
]

open_image = [
	{ run = "nsxiv-rifle %s",             desc = "Open", for = "linux" },
]

reveal = [
	{ run = "xdg-open %d1",                          desc = "Reveal", for = "linux" },
	{ run = 'open -R "$1"',                          desc = "Reveal", for = "macos" },
	{ run = 'explorer /select, "%1"', orphan = true, desc = "Reveal", for = "windows" },
	{ run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]

[open]
prepend_rules = [
	{ mime = "image/*",                      use = [ "open_image", "reveal" ] },
	{ mime = "application/octet-stream",     use = [ "edit", "reveal" ] },
]

[plugin]
prepend_previewers = [
    { mime = 'audio/mpegurl', run = 'code' }, # ignore .m3u files
    { mime = 'audio/*',   run = 'preview-audio' },
    { url = "*.tar*",     run = 'piper --format=url -- tar tf "$1"'},
    { url = "*.csv",      run = 'piper -- bat -p --color=always "$1"'},
    { url = "*.md",       run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'},
    { url = '*.epub',     run = 'preview-epub' },
    { url = '*.cb{z,r}',  run = 'preview-cbz' },
    { mime = "image/djvu", run  = "djvu-view" },

    # Fallback
    { mime = "application/octet-stream",    run = "code" },
]

prepend_preloaders = [
  { url = '*.epub',      run = 'preview-epub' },
  { url = '*.cb{z,r}',   run = 'preview-cbz' },
  { mime = "image/djvu", run  = "djvu-view" },
  { mime = 'audio/mpegurl', run = 'code' }, # ignore .m3u files
  { mime = 'audio/*',    run = 'preview-audio' },
]

[[plugin.prepend_fetchers]]
url  = "local://*"
run  = "mime-ext.local"
prio = "high"
group = "mime"

[[plugin.prepend_fetchers]]
url  = "remote://*"
run  = "mime-ext.remote"
prio = "high"
group = "mime"

[[plugin.prepend_fetchers]]
id   = "git"
url = "*"
run  = "git"
group = "url"

[[plugin.prepend_fetchers]]
id   = "git"
url = "*/"
run  = "git"
group = "url"
